name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# A branch with a red job here cannot show green - this workflow's name is what a GitHub branch
# protection rule requires (docs/backlog/0-04-ci-pipeline.md, conventions/git-workflow.md).
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Ago.Platform.slnx

      # 17-04: severity threshold and fail/report policy, stated explicitly rather than left as an
      # unstated default (docs/runbooks/vulnerability-response.md in ago-root has the fuller
      # reasoning). Critical/High fails the build - those are worth blocking a merge over; Moderate/Low
      # are printed here and in the step summary but do not fail, because a check that blocks every
      # branch on an untriaged transitive Low advisory nobody can act on trains people to ignore red CI
      # rather than read it. `dotnet list package --vulnerable` itself always exits 0 regardless of
      # findings (verified while writing this check), so the exit code below comes from parsing
      # `--format json` output instead - the command's human-readable text is also localised to the
      # runner's OS locale (it printed in Russian against this author's own non-en-US machine while
      # this was being written), which would make grepping it for an English phrase fragile in exactly
      # the way a locale-independent JSON parse is not. Runs before Format/Build/Test: it only needs a
      # restore, and a vulnerable dependency is worth knowing about even on a branch that doesn't
      # otherwise compile.
      - name: Vulnerability check (dotnet list package --vulnerable)
        run: |
          set -euo pipefail
          dotnet list Ago.Platform.slnx package --vulnerable --include-transitive --no-restore \
            --format json --output-version 1 > vulnerable.json

          total=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? ] | length' vulnerable.json)
          high_critical=$(jq '[ .projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? | select(.severity=="Critical" or .severity=="High") ] | length' vulnerable.json)

          echo "Vulnerable package references: $total total, $high_critical at Critical/High."
          jq -r '.projects[] as $p | ($p.frameworks[]? // empty) as $f | (($f.topLevelPackages[]? // empty), ($f.transitivePackages[]? // empty)) | . as $pkg | $pkg.vulnerabilities[]? | "  \($p.path | split("/") | last)  \($pkg.id) \($pkg.resolvedVersion // $pkg.requestedVersion)  \(.severity)  \(.advisoryurl)"' vulnerable.json

          {
            echo "### Dependency vulnerability check"
            echo
            echo "$total vulnerable package reference(s), $high_critical at Critical/High severity."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$high_critical" -gt 0 ]; then
            echo "::error::$high_critical package(s) at Critical/High severity - failing the build. See the list above."
            exit 1
          fi

      # Runs before build so a formatting-only branch fails fast, before paying for compilation.
      - name: Format check
        run: dotnet format Ago.Platform.slnx --verify-no-changes

      - name: Build
        run: dotnet build Ago.Platform.slnx --no-restore -c Release

      # Ago.Platform.Architecture.Tests is an ordinary test project in this solution, so the
      # layering rules it encodes run here with no separate job - a deliberate violation fails
      # this step exactly like a broken unit test would.
      - name: Test
        run: >
          dotnet test Ago.Platform.slnx --no-build -c Release
          --logger trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults

  # Packs main only - a branch producing a .nupkg nobody will consume is wasted CI time, and
  # publishing from every push would let two branches race to claim the same version number.
  pack:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # write is needed to publish to this repository's own GitHub Packages feed below - the default
    # GITHUB_TOKEN can do that for its own repository with no extra secret (adr/0018).
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # CHANGELOG.md is the single source of truth for the published version - not
      # Directory.Build.props's <Version>, which packing ignores here. That forces every version
      # bump through the file a consumer actually reads, instead of two places that can drift.
      - name: Read version from CHANGELOG.md
        id: version
        run: |
          version=$(grep -m1 '^## \[' CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')
          if [ -z "$version" ]; then
            echo "Could not find a '## [x.y.z]' heading at the top of CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack Ago.Platform.slnx -c Release -o nupkgs
          -p:Version=${{ steps.version.outputs.version }}

      # Kept alongside the registry push below: lets a reviewer without package-read access grab
      # the .nupkg straight from the Actions run, no credential needed.
      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nupkgs-${{ steps.version.outputs.version }}
          path: nupkgs/*.nupkg

      # adr/0018: the durable feed ago-chat's CI restores from. --skip-duplicate makes a re-run of
      # this job on the same commit (e.g. a retry) a no-op instead of a hard failure - GitHub
      # Packages rejects re-pushing a version that already exists.
      - name: Push packages to GitHub Packages
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --source https://nuget.pkg.github.com/golyakoff/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
